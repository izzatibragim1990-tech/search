<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Github search users</title>
  
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script defer="defer" src="app.js"></script>
    <link href="main1.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div>
        <div class="navbar">
          <div class="logo">
           
            <h3 class="name_title"></h3>
          </div>
          <form>
            <p class="repo_1">Repositories</p>
            <p class="count_repo"></p>
            <input
              class="input_user"
              autofocus
              placeholder="Search for users"
            />
            <img class="profile_img" src="" alt="" />
          </form>
        </div>
      </div>
      <div class="information">
        <div class="user">
          <img
            class="user_img"
            src="image/98c58552e90a6db86237f11d869ab889.jpg"
            alt=""
          />
          <h1 class="user_name"></h1>
          <h3 class="username"></h3>
          <h3 class="bio"></h3>
          <div class="follow">
            <p class="followers fol"></p>
            <p class="following fol"></p>
          </div>
        </div>
        <div class="repos"></div>
      </div>
    </div>
    <div class="not_found">
      <p class="error">NOT FOUND THIS USER</p>
      <button class="btn">OK</button>
    </div>
  </body>
</html>
